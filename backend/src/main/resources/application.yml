# 公共配置。数据库密码、SMTP 授权码这类本机才有的东西，放在 application-local.yml（不提交，模板见 application-local.example.yml）
server:
  port: 8090              # 8080 在开发机上被 Steam 占用了
  tomcat:
    # 上传超过大小限制时，Tomcat 先把剩下的请求体读掉再回"文件太大"；默认只读 2 MB，超过就直接断开，客户端看到的是连接断了
    max-swallow-size: 10MB

spring:
  application:
    name: team-match
  profiles:
    active: local
  datasource:
    url: jdbc:mysql://localhost:3306/team_match?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 5MB      # 截图认证的图片
      max-request-size: 6MB
  jackson:
    deserialization:
      # Jackson 3 默认在 boolean、int 这类字段缺省时直接报错；这里改回缺省就取默认值（false / 0）
      fail-on-null-for-primitives: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 2592000          # 登录有效期 30 天
  is-concurrent: true       # 允许同一账号多处登录
  is-share: false
  token-style: uuid
  is-read-cookie: false
  is-log: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  mail:
    mode: log               # log：验证码打印在控制台，开发用；smtp：真的发邮件，要配 spring.mail
    from: ""
  code:
    ttl-minutes: 10
    resend-seconds: 60
    max-attempts: 5
  admin-emails: []          # 用这些邮箱注册的账号自动成为管理员，在 application-local.yml 里填
  screenshot:
    upload-dir: uploads     # 截图认证的原图存这里（相对启动目录），审核完就删
    ocr-enabled: true       # 本地 OCR 预审；关掉就只存图、全靠管理员人工看
    daily-limit: 3          # 每人每天最多提交几次
  recognition:
    confirms-needed: 2      # 各校加分认定：除了提交的人，还要几位同校同学确认才对外显示
  crawler:
    enabled: true           # 每天定时抓一次比赛官网的通知；关掉后管理员仍可以在后台手动抓
    cron: "0 30 7 * * *"    # 每天 7:30
    delay-ms: 2000          # 同一个网站两次请求至少隔 2 秒（robots.txt 要求更久就按它的）
    timeout-ms: 15000
    max-pages-per-source: 10  # 每个来源一次最多打开 10 篇新通知
    llm:                    # 规则没抽全的通知交给大模型补（可选，默认关）。OpenAI 兼容接口，本机小模型或云端都行
      enabled: false
      base-url: http://127.0.0.1:8096/v1
      model: qwen3.8-27b
      timeout-ms: 120000
      max-chars: 6000       # 正文最多发 6000 字
  reminder:
    enabled: true           # 截止提醒、里程碑提醒
    interval-ms: 600000     # 每 10 分钟检查一次
  notify-mail:
    enabled: true           # 不在网站上的人，新消息超过 delay-seconds 没看就汇总发一封邮件（log 模式下打印在控制台）
    delay-seconds: 600      # 10 分钟
    interval-ms: 300000     # 每 5 分钟检查一次
    site-url: http://localhost:5173   # 邮件里"打开竞搭"的网址，部署后改成真实地址
