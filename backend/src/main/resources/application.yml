# 公共配置。数据库密码、SMTP 授权码这类本机才有的东西，放在 application-local.yml（不提交，模板见 application-local.example.yml）
server:
  port: 8090              # 8080 在开发机上被 Steam 占用了
  tomcat:
    # 上传超过大小限制时，Tomcat 先把剩下的请求体读掉再回"文件太大"；默认只读 2 MB，超过就直接断开，客户端看到的是连接断了
    max-swallow-size: 10MB

spring:
  application:
    name: team-match
  profiles:
    active: local
  datasource:
    # createDatabaseIfNotExist：库不存在时由驱动先建出来，表和初始数据交给下面的 Flyway
    url: jdbc:mysql://localhost:3306/team_match?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: root
    password: ${DB_PASSWORD:}
    hikari:
      # 读已提交：事务里等到锁以后，再查能看到别人刚提交的数据。MySQL 默认的可重复读会一直读事务开始时的快照，
      # 两个人同时被同意入队时，后一个数人数看不到前一个，队伍满了还显示"招募中"，接着就能超员
      transaction-isolation: TRANSACTION_READ_COMMITTED
  flyway:
    # 建表、改表都在 src/main/resources/db/migration（V1 建表、V2 初始数据、V3 起是之后的改动），启动时按编号执行没跑过的。
    # 以前手工导入 schema.sql 建的库没有迁移记录：记成"已经到 V2"，接着从 V3（旧库补齐）往后执行，数据不动
    baseline-on-migrate: true
    baseline-version: 2
    # 允许补执行编号更小、还没执行过的迁移：两个人各自加的迁移后合并的那个照样会执行；
    # 补回被误删的表时，删掉 flyway_schema_history 里 V3 那一行再启动，V3 会重新执行（它可以重复执行）
    out-of-order: true
  servlet:
    multipart:
      max-file-size: 5MB      # 截图认证的图片
      max-request-size: 6MB
  jackson:
    deserialization:
      # Jackson 3 默认在 boolean、int 这类字段缺省时直接报错；这里改回缺省就取默认值（false / 0）
      fail-on-null-for-primitives: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 2592000          # 登录有效期 30 天
  is-concurrent: true       # 允许同一账号多处登录
  is-share: false
  token-style: uuid
  is-read-cookie: false
  is-log: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  mail:
    mode: log               # log：验证码打印在控制台，开发用；smtp：真的发邮件，要配 spring.mail
    from: ""
  code:
    ttl-minutes: 10
    resend-seconds: 60
    max-attempts: 5
  admin-emails: []          # 用这些邮箱注册的账号自动成为管理员，在 application-local.yml 里填
  ai:                       # AI 能力分析 / 招募建议（模型连接用下面的 app.llm）
    enabled: false          # 打开后才会把档案发给模型做分析；关着时用本地规则，页面会标明"本地规则"
    max-tokens: 1200
    cooldown-seconds: 60    # 同一个人 / 同一支队两次 AI 分析至少隔多久，防止反复点
  screenshot:
    upload-dir: uploads     # 截图认证的原图存这里（相对启动目录），审核完就删
    ocr-enabled: true       # 本地 OCR 预审；关掉就只存图、全靠管理员人工看
    daily-limit: 3          # 每人每天最多提交几次
  recognition:
    confirms-needed: 2      # 各校加分认定：除了提交的人，还要几位同校同学确认才对外显示
  crawler:
    enabled: true           # 每天定时抓一次比赛官网的通知；关掉后管理员仍可以在后台手动抓
    cron: "0 30 7 * * *"    # 每天 7:30
    delay-ms: 2000          # 同一个网站两次请求至少隔 2 秒（robots.txt 要求更久就按它的）
    timeout-ms: 15000
    max-pages-per-source: 10  # 每个来源一次最多打开 10 篇新通知
  llm:                      # 大模型连接（可选，默认关）：爬虫补抽、比赛页 AI 整理、AI 能力分析共用。OpenAI 兼容接口，本机小模型或云端都行
    enabled: false
    base-url: http://127.0.0.1:8096/v1
    model: qwen3.8-27b
    timeout-ms: 120000
    max-chars: 6000         # 爬虫和 AI 整理发给模型的正文最多 6000 字
    wait-ms: 20000          # 本机模型一次只处理一个请求，别的请求最多排队等 20 秒
  reminder:
    enabled: true           # 截止提醒、里程碑提醒
    interval-ms: 600000     # 每 10 分钟检查一次
  notify-mail:
    enabled: true           # 不在网站上的人，新消息超过 delay-seconds 没看就汇总发一封邮件（log 模式下打印在控制台）
    delay-seconds: 600      # 10 分钟
    interval-ms: 300000     # 每 5 分钟检查一次
    site-url: http://localhost:5173   # 邮件里"打开竞搭"的网址，部署后改成真实地址
