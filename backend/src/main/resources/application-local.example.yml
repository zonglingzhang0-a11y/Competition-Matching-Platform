# 复制一份，改名为 application-local.yml，填上本机的配置。这个文件已经在 .gitignore 里，不会被提交。
spring:
  datasource:
    username: root
    password: 你的 MySQL 密码

  # 想真的发邮件时再配。以 QQ 邮箱为例：在 QQ 邮箱设置里开启 SMTP 服务，拿到"授权码"填在 password 里
  # mail:
  #   host: smtp.qq.com
  #   port: 465
  #   username: 你的邮箱@qq.com
  #   password: SMTP 授权码
  #   properties:
  #     mail.smtp.ssl.enable: true

app:
  # 用这些邮箱注册的账号自动成为管理员；已经注册过的，下次启动后端时升级
  admin-emails:
    - 你的邮箱@example.com
#   mail:
#     mode: smtp
#     from: 你的邮箱@qq.com
#   notify-mail:
#     site-url: http://你的服务器地址   # 新消息邮件里的链接
#   llm:                    # 大模型连接：爬虫补抽、比赛页 AI 整理、AI 能力分析共用（以前叫 crawler.llm）
#     enabled: true         # 本机模型只要 enabled: true；云端模型再填地址、模型名和密钥
#     base-url: https://api.deepseek.com/v1
#     model: deepseek-chat
#     api-key: 你的密钥
#   ai:                     # AI 能力分析 / 招募建议：会把档案发给上面的模型，单独开关
#     enabled: true         # 关着或模型连不上时用本地规则，页面会标明来源
#     cooldown-seconds: 60
