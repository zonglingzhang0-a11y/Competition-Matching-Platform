# 推到 main / dev、或者往这两个分支提 PR 时，自动跑后端测试和前端检查。
# 本机没有 JDK 21 的同学，提 PR 后在 PR 页面下方就能看到结果。
name: 检查

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  # 和部署环境一致，按北京时间算日期
  TZ: Asia/Shanghai

jobs:
  backend:
    name: 后端测试（JDK 21）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # mvnw 在仓库里没有可执行权限，用 sh 跑
      - run: sh ./mvnw -B -q test

  frontend:
    name: 前端检查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: 类型检查
        run: npm run type-check
      # npm run lint 带 --fix 会改文件，这里只检查不修
      - name: 代码检查
        run: npx oxlint . && npx eslint .
      - name: 单元测试
        run: npm test
      - name: 打包
        run: npm run build-only
