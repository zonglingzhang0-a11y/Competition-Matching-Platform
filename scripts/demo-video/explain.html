<!doctype html>
<!-- 演示视频里的讲解动画：片头卡片和"分数是怎么算出来的"。
     数字全部来自 window.__DATA（录制脚本从后端接口取来注入），这里只负责按步骤播放；
     录制脚本调用 demo.xxx() 推进每一步，和台词对齐。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/misans-webfont@4.3.1/misans/misans-regular/result.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/misans-webfont@4.3.1/misans/misans-bold/result.min.css">
<style>
  :root { --bg:#ECE8E1; --card:#F6F4F0; --ink:#1B1A17; --body:#4A463F; --mute:#6B655C; --line:#D3CCC1;
          --acc:#8A5A2B; --acc-light:#D79A5B; --red:#B03A2E; --spring:cubic-bezier(.34,1.56,.64,1); }
  * { box-sizing:border-box; margin:0; padding:0 }
  html, body { width:1536px; height:864px; overflow:hidden; background:var(--bg); color:var(--ink);
               font-family:'MiSans','Microsoft YaHei',sans-serif; -webkit-font-smoothing:antialiased }

  /* 背景里缓慢漂动的光斑，画面不会完全静止 */
  .blobs i { position:absolute; border-radius:50%; filter:blur(10px); opacity:.55 }
  .blobs i:nth-child(1) { width:620px; height:620px; left:-160px; top:-220px;
    background:radial-gradient(circle, #DDBB93 0%, rgba(221,187,147,0) 70%); animation:float1 14s ease-in-out infinite alternate }
  .blobs i:nth-child(2) { width:720px; height:720px; right:-240px; bottom:-300px;
    background:radial-gradient(circle, #C9A27A 0%, rgba(201,162,122,0) 70%); animation:float2 17s ease-in-out infinite alternate }
  .blobs i:nth-child(3) { width:420px; height:420px; right:280px; top:-160px;
    background:radial-gradient(circle, #EFE3D2 0%, rgba(239,227,210,0) 70%); animation:float1 11s ease-in-out infinite alternate-reverse }
  @keyframes float1 { to { transform:translate(120px, 80px) } }
  @keyframes float2 { to { transform:translate(-140px, -60px) } }

  .scene { position:absolute; inset:0; padding:72px 96px; display:none }
  .scene.show { display:block }
  .eyebrow { font-size:18px; letter-spacing:4px; font-weight:700; color:var(--acc) }
  h1 { font-size:52px; font-weight:700; margin-top:14px; line-height:1.2 }
  .fade { opacity:0; transform:translateY(24px); transition:opacity .45s ease, transform .6s var(--spring) }
  .slide { opacity:0; transform:translateX(-40px); transition:opacity .45s ease, transform .6s var(--spring) }
  .fade.in, .slide.in { opacity:1; transform:none }
  @keyframes pop { 0% { transform:scale(1.45) } 100% { transform:scale(1) } }
  @keyframes pulse { 0% { transform:scale(1) } 35% { transform:scale(1.09) } 100% { transform:scale(1) } }
  .pop { display:inline-block; animation:pop .45s var(--spring) }
  .pulse { animation:pulse .7s ease-out }

  #title.show { display:flex; flex-direction:column; justify-content:center }
  #title .big { font-size:110px; font-weight:700; line-height:1.05; margin-top:18px; display:flex }
  #title .big span { display:inline-block; opacity:0; transform:translateY(60px) rotate(4deg);
    transition:opacity .4s ease, transform .7s var(--spring) }
  #title .big span.in { opacity:1; transform:none }
  #title h1 { font-size:54px; color:var(--body) }
  #title .sub { font-size:26px; color:var(--mute); margin-top:22px }
  #title .bar { width:0; height:5px; background:var(--acc); margin-top:36px; border-radius:3px;
    transition:width 1.1s cubic-bezier(.2,.8,.2,1) }

  .rows { margin-top:56px; display:flex; flex-direction:column; gap:24px; width:900px }
  .row { display:grid; grid-template-columns:170px 1fr 76px 76px 110px; align-items:center; gap:16px; font-size:28px }
  .row .name { font-weight:700 }
  .track { height:16px; background:#DDD6CB; border-radius:8px; overflow:hidden }
  .fill { height:100%; width:0; background:linear-gradient(90deg, var(--acc), var(--acc-light)); border-radius:8px;
          transition:width 1s cubic-bezier(.2,.9,.25,1.05) }
  .num { font-variant-numeric:tabular-nums; text-align:right }
  .w { color:var(--mute); text-align:center }
  .contrib { font-weight:700; color:var(--acc); text-align:right; font-variant-numeric:tabular-nums }
  .sum { margin-top:28px; width:900px; display:flex; justify-content:space-between; border-top:2px solid var(--ink);
         padding-top:16px; font-size:32px; font-weight:700 }
  .sum .hint { font-weight:400; font-size:20px; color:var(--mute); margin-left:12px }
  .sum .num { display:inline-block; transform-origin:right center }
  .side { position:absolute; right:96px; top:206px; width:400px; display:flex; flex-direction:column; gap:14px }
  .chip { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 20px; font-size:20px;
          line-height:1.45; color:var(--body); box-shadow:0 8px 24px rgba(27,26,23,.06) }
  .chip.fade { transform:translateY(18px) scale(.9) }
  .chip.fade.in { transform:none }
  .chip b { font-size:28px; display:block; color:var(--ink) }
  .chip.red { border-color:#D9A79F } .chip.red b { color:var(--red) }
  .total { position:absolute; right:96px; bottom:64px; width:400px; background:var(--ink); color:#F6F1E8;
           border-radius:16px; padding:20px 24px; box-shadow:0 18px 40px rgba(27,26,23,.25); transform-origin:center }
  .total.fade { transform:translateY(30px) scale(.88) }
  .total.fade.in { transform:none }
  .total .big { font-size:88px; font-weight:700; line-height:1; font-variant-numeric:tabular-nums; display:inline-block;
                transform-origin:left center }
  .total .cap { font-size:20px; color:#C9C2B6; margin-top:8px; line-height:1.4 }

  /* 信用分场景 */
  .crow { display:grid; grid-template-columns:340px 110px 70px 90px; align-items:center; gap:18px; font-size:26px }
  .crow .name { font-weight:500 }
  .freq { justify-self:start; font-size:22px; font-weight:700; padding:4px 14px; border-radius:999px; background:#E3DDD3; color:var(--body) }
  .freq.v1 { background:#EBD8BF; color:#6B4A22 } .freq.v2 { background:#E2B58A; color:#4E3214 }
  .freq.v3 { background:var(--red); color:#FBF3EE }
  .formula { margin-top:18px; font-size:30px; font-weight:700; color:var(--acc); font-variant-numeric:tabular-nums }

  /* 抢最后一个名额 */
  .arena { position:absolute; left:96px; right:96px; top:250px; height:330px }
  .req { position:absolute; top:70px; width:330px; background:var(--card); border:1px solid var(--line); border-radius:14px;
         padding:18px 22px; box-shadow:0 10px 26px rgba(27,26,23,.08); opacity:0;
         transition:opacity .4s ease, transform .9s cubic-bezier(.65,0,.35,1) }
  .req b { display:block; font-size:28px } .req span { font-size:20px; color:var(--mute) }
  #rq-a { left:0; transform:translateX(-60px) } #rq-b { right:0; transform:translateX(60px) }
  .req.in { opacity:1; transform:none } #rq-a.go { transform:translateX(150px) } #rq-b.go { transform:translateX(-150px) }
  .team { position:absolute; left:50%; top:20px; width:340px; margin-left:-170px; background:var(--ink); color:#F6F1E8;
          border-radius:18px; padding:24px; text-align:center; opacity:0; transform:scale(.9);
          transition:opacity .4s ease, transform .6s var(--spring); box-shadow:0 20px 44px rgba(27,26,23,.28) }
  .team.in { opacity:1; transform:none }
  .team .tname { font-size:24px; color:#C9C2B6 }
  .team .count { font-size:84px; font-weight:700; line-height:1.1; font-variant-numeric:tabular-nums }
  .team .state { font-size:22px; color:#E7B47D; min-height:30px }
  .lock { width:48px; height:48px; margin:6px auto 0 }
  .lock .shackle { transition:transform .35s ease; transform-origin:30px 22px; transform:translateY(-7px) }
  .lock.closed .shackle { transform:none }
  .verdict { position:absolute; top:200px; width:330px; font-size:22px; line-height:1.45; padding:12px 18px; border-radius:12px;
             opacity:0; transform:translateY(12px) scale(.92); transition:opacity .35s ease, transform .5s var(--spring) }
  .verdict.in { opacity:1; transform:none }
  .verdict.ok { background:#E3EDDC; color:#2F5A23 } .verdict.no { background:#F3DCD7; color:#8E2B1F }
  .verdict b { display:block; font-size:26px }
  #vd-a { left:0 } #vd-b { right:0 }
  /* 邮箱认学校 */
  .email { margin-top:34px; font-size:44px; font-weight:700; letter-spacing:1px; font-variant-numeric:tabular-nums }
  .email .at { color:var(--mute) } .email .dom { color:var(--acc); border-bottom:4px solid var(--acc-light) }
  .cands { margin-top:30px; display:flex; flex-direction:column; gap:14px; width:880px }
  .cand { display:grid; grid-template-columns:330px 1fr 260px; align-items:center; gap:18px; font-size:26px;
          background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 20px }
  .cand code { font-family:'JetBrains Mono','Consolas',monospace; font-size:26px; font-weight:700 }
  .cand .look { color:var(--mute); font-size:22px }
  .cand .res { justify-self:end; font-weight:700; font-size:24px; opacity:0; transform:scale(.8);
               transition:opacity .3s ease, transform .45s var(--spring) }
  .cand .res.in { opacity:1; transform:none }
  .cand .res.miss { color:var(--mute) } .cand .res.hit { color:#2F5A23 }
  .cand.best { border:3px solid var(--acc-light); box-shadow:0 10px 26px rgba(138,90,43,.18) }
  .school { margin-top:24px; display:inline-block; background:var(--ink); color:#F6F1E8; border-radius:16px; padding:18px 26px }
  .school b { font-size:44px; display:block } .school span { font-size:20px; color:#C9C2B6 }
  /* 片尾 */
  #outro.show { display:flex; flex-direction:column; justify-content:center }
  .stats { margin-top:40px; display:grid; grid-template-columns:repeat(4, 1fr); gap:28px; width:1300px }
  .stat { border-top:3px solid var(--acc); padding-top:14px }
  .stat .n { font-size:72px; font-weight:700; line-height:1; font-variant-numeric:tabular-nums; display:inline-block }
  .stat .l { font-size:22px; color:var(--body); margin-top:8px }
  .slogan { margin-top:46px; font-size:40px; font-weight:700 }
  .url { margin-top:16px; font-size:30px; color:var(--acc); font-weight:700; letter-spacing:1px }
  .how { position:absolute; left:96px; right:96px; bottom:150px; font-size:24px; color:var(--body); line-height:1.5;
         border-top:2px solid var(--ink); padding-top:16px }
</style>
</head>
<body>
<div class="blobs"><i></i><i></i><i></i></div>

<section id="title" class="scene">
  <p class="eyebrow fade" id="t-eb"></p>
  <div class="big" id="t-big"></div>
  <h1 class="fade" id="t-h"></h1>
  <p class="sub fade" id="t-sub"></p>
  <div class="bar" id="t-bar"></div>
</section>

<section id="explain" class="scene">
  <p class="eyebrow fade" id="e-eb"></p>
  <h1 class="fade" id="e-h"></h1>
  <div class="rows" id="rows"></div>
  <div class="sum fade" id="sum"><span>加权合计<span class="hint" id="sum-hint"></span></span><span class="num" id="sum-v">0</span></div>
  <div class="side" id="side"></div>
  <div class="total fade" id="total"><div class="big" id="total-v">0</div><div class="cap" id="total-cap"></div></div>
</section>

<section id="race" class="scene">
  <p class="eyebrow fade" id="ra-eb"></p>
  <h1 class="fade" id="ra-h"></h1>
  <div class="arena">
    <div class="req" id="rq-a"><b id="rq-a-t"></b><span>队长点「同意」</span></div>
    <div class="team" id="ra-team">
      <div class="tname" id="ra-tname"></div>
      <div class="count" id="ra-count"></div>
      <div class="state" id="ra-state"></div>
      <svg class="lock" id="ra-lock" viewBox="0 0 60 60" aria-label="锁">
        <path class="shackle" d="M18 28 V20 a12 12 0 0 1 24 0 V28" fill="none" stroke="#E7B47D" stroke-width="5" stroke-linecap="round"/>
        <rect x="12" y="27" width="36" height="26" rx="6" fill="#E7B47D"/>
      </svg>
    </div>
    <div class="req" id="rq-b"><b id="rq-b-t"></b><span>队长点「同意」</span></div>
    <div class="verdict" id="vd-a"></div>
    <div class="verdict" id="vd-b"></div>
  </div>
  <p class="how fade" id="ra-how"></p>
</section>

<section id="outro" class="scene">
  <p class="eyebrow fade" id="ou-eb"></p>
  <h1 class="fade" id="ou-h" style="font-size:64px"></h1>
  <div class="stats" id="ou-stats"></div>
  <p class="slogan fade" id="ou-slogan"></p>
  <p class="url fade" id="ou-url"></p>
</section>

<section id="domain" class="scene">
  <p class="eyebrow fade" id="dm-eb"></p>
  <h1 class="fade" id="dm-h"></h1>
  <p class="email fade" id="dm-email"></p>
  <div class="cands" id="dm-cands"></div>
  <div class="school fade" id="dm-school"></div>
  <div class="side" id="dm-side" style="top:250px"></div>
</section>

<section id="credit" class="scene">
  <p class="eyebrow fade" id="cr-eb"></p>
  <h1 class="fade" id="cr-h"></h1>
  <div class="rows" id="cr-rows"></div>
  <div class="sum fade" id="cr-sum"><span>扣分合计<span class="hint" id="cr-hint"></span></span><span class="num" id="cr-pen">0</span></div>
  <p class="formula fade" id="cr-formula"></p>
  <div class="side" id="cr-side"></div>
</section>

<script>
const D = window.__DATA;
const $ = (id) => document.getElementById(id);
const fmt = (v) => (Math.round(v * 10) / 10).toString();
function countUp(el, to, ms, done) {
  const t0 = performance.now();
  const step = (now) => {
    const k = Math.min(1, (now - t0) / ms), e = 1 - Math.pow(1 - k, 3);
    el.textContent = fmt(to * e);
    if (k < 1) requestAnimationFrame(step); else if (done) done();
  };
  requestAnimationFrame(step);
}
const show = (el) => requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('in')));
const kick = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };

window.demo = {
  // h 里有"："时，冒号前做成逐字弹出的大字，后面一行跟着滑进来
  title(eb, h, sub) {
    $('title').classList.add('show');
    const [big, rest] = h.includes('：') ? h.split('：') : ['', h];
    $('t-eb').textContent = eb;
    $('t-big').innerHTML = [...big].map((c) => `<span>${c}</span>`).join('');
    $('t-h').textContent = rest; $('t-sub').textContent = sub;
    show($('t-eb'));
    [...$('t-big').children].forEach((s, i) => setTimeout(() => s.classList.add('in'), 200 + i * 90));
    setTimeout(() => show($('t-h')), 300 + big.length * 90);
    setTimeout(() => { $('t-bar').style.width = '460px'; }, 450 + big.length * 90);
    setTimeout(() => show($('t-sub')), 700 + big.length * 90);
  },
  explain() {
    $('explain').classList.add('show');
    $('e-eb').textContent = D.eyebrow;
    $('e-h').textContent = D.heading;
    show($('e-eb')); setTimeout(() => show($('e-h')), 180);
    $('rows').innerHTML = D.dims.map((d, i) => `
      <div class="row slide" id="r${i}">
        <span class="name">${d.name}</span>
        <div class="track"><div class="fill" id="f${i}"></div></div>
        <span class="num" id="v${i}">0</span>
        <span class="w">× ${d.weight}</span>
        <span class="contrib" id="c${i}"></span>
      </div>`).join('');
  },
  // 每一行间隔 380ms；录制脚本按同样的间隔记音效点
  rows() {
    D.dims.forEach((d, i) => setTimeout(() => {
      show($('r' + i));
      setTimeout(() => { $('f' + i).style.width = d.score + '%'; countUp($('v' + i), d.score, 800); }, 150);
      setTimeout(() => { $('c' + i).innerHTML = `<span class="pop">= ${fmt(d.score * d.weight)}</span>`; }, 900);
    }, i * 380));
  },
  sum() {
    $('sum-hint').textContent = D.sumHint;
    show($('sum'));
    countUp($('sum-v'), D.weighted, 900, () => kick($('sum-v'), 'pulse'));
  },
  chips() {
    $('side').innerHTML = D.chips.map((c, i) =>
      `<div class="chip fade${c.red ? ' red' : ''}" id="k${i}"><b>${c.title}</b>${c.text}</div>`).join('');
    D.chips.forEach((c, i) => setTimeout(() => show($('k' + i)), i * 450));
  },
  total() {
    $('total-cap').textContent = D.totalCaption;
    show($('total'));
    countUp($('total-v'), D.score, 1200, () => { kick($('total-v'), 'pulse'); kick($('total'), 'pulse'); });
  },

  // ---- 抢最后一个名额：两个同意请求同时到达，先拿到锁的进队，另一个被拦下（结果是真实请求的返回） ----
  race() {
    const R = D.race;
    $('race').classList.add('show');
    $('ra-eb').textContent = R.eyebrow; $('ra-h').textContent = R.heading;
    $('ra-tname').textContent = R.team; $('ra-count').textContent = `${R.before}/${R.max}`;
    $('ra-state').textContent = '还剩 1 个名额';
    $('rq-a-t').textContent = `同意 ${R.a.name}`; $('rq-b-t').textContent = `同意 ${R.b.name}`;
    show($('ra-eb')); setTimeout(() => show($('ra-h')), 180);
    setTimeout(() => show($('ra-team')), 450);
    setTimeout(() => { show($('rq-a')); show($('rq-b')); }, 750);
  },
  raceGo() {
    const R = D.race, win = R.winner === 'a' ? $('rq-a') : $('rq-b');
    $('rq-a').classList.add('go'); $('rq-b').classList.add('go');
    setTimeout(() => { $('ra-lock').classList.add('closed'); win.style.borderColor = '#D79A5B'; win.style.borderWidth = '3px'; }, 700);
    setTimeout(() => {
      $('ra-count').textContent = `${R.after}/${R.max}`; kick($('ra-count'), 'pulse');
      $('ra-state').textContent = '满员';
      const v = $(R.winner === 'a' ? 'vd-a' : 'vd-b'), who = R[R.winner];
      v.className = 'verdict ok'; v.innerHTML = `<b>成功（${who.code}）</b>${who.name} 进队`; show(v);
    }, 1300);
  },
  raceEnd() {
    const R = D.race, loserKey = R.winner === 'a' ? 'b' : 'a', who = R[loserKey];
    $('ra-lock').classList.remove('closed');
    const v = $('vd-' + loserKey);
    v.className = 'verdict no'; v.innerHTML = `<b>被拦下（${who.code}）</b>“${who.msg}”`; show(v);
    setTimeout(() => { $('ra-how').textContent = R.how; show($('ra-how')); }, 700);
  },

  // ---- 片尾：工程数字逐个滚出来，最后是口号和网址 ----
  outro() {
    const O = D.outro;
    $('outro').classList.add('show');
    $('ou-eb').textContent = O.eyebrow; $('ou-h').textContent = O.heading;
    $('ou-slogan').textContent = O.slogan; $('ou-url').textContent = O.url;
    show($('ou-eb')); setTimeout(() => show($('ou-h')), 180);
    $('ou-stats').innerHTML = O.stats.map((s, i) =>
      `<div class="stat fade" id="os${i}"><span class="n" id="on${i}">0</span><div class="l">${s.label}</div></div>`).join('');
    O.stats.forEach((s, i) => setTimeout(() => {
      show($('os' + i));
      countUp($('on' + i), s.value, 900, () => { $('on' + i).textContent = s.value; kick($('on' + i), 'pulse'); });
    }, 600 + i * 380));
    setTimeout(() => show($('ou-slogan')), 600 + O.stats.length * 380 + 500);
    setTimeout(() => show($('ou-url')), 600 + O.stats.length * 380 + 900);
  },

  // ---- 邮箱认学校：域名一层层往上列候选，去收录的后缀里查，命中的取最长的（和 SchoolResolver 一致） ----
  domain() {
    const M = D.domain, at = M.email.lastIndexOf('@');
    $('domain').classList.add('show');
    $('dm-eb').textContent = M.eyebrow; $('dm-h').textContent = M.heading;
    $('dm-email').innerHTML = `${M.email.slice(0, at)}<span class="at">@</span><span class="dom">${M.email.slice(at + 1)}</span>`;
    show($('dm-eb')); setTimeout(() => show($('dm-h')), 180); setTimeout(() => show($('dm-email')), 450);
    $('dm-cands').innerHTML = M.steps.map((s, i) => `
      <div class="cand slide" id="dc${i}"><code>${s.domain}</code><span class="look">查收录的邮箱后缀</span>
        <span class="res ${s.school ? 'hit' : 'miss'}" id="dr${i}">${s.school ? '✓ ' + s.school : '✗ 没收录'}</span></div>`).join('');
  },
  domainSteps() {
    D.domain.steps.forEach((s, i) => setTimeout(() => {
      show($('dc' + i));
      setTimeout(() => show($('dr' + i)), 500);
    }, i * 650));
  },
  domainResult() {
    const M = D.domain;
    M.steps.forEach((s, i) => { if (s.best) $('dc' + i).classList.add('best'); });
    $('dm-school').innerHTML = `<b>${M.school}</b><span>${M.place} · 验证码一通过就直接认证</span>`;
    show($('dm-school'));
    $('dm-side').innerHTML = M.cards.map((c, i) => `<div class="chip fade" id="dk${i}"><b>${c.title}</b>${c.text}</div>`).join('');
    M.cards.forEach((c, i) => setTimeout(() => show($('dk' + i)), 600 + i * 500));
  },

  // ---- 信用分：一个评分人的 6 项选择 → 扣分 → 本轮得分；右边是信用分和投入保障 ----
  credit() {
    const C = D.credit;
    $('credit').classList.add('show');
    $('cr-eb').textContent = C.eyebrow;
    $('cr-h').textContent = C.heading;
    show($('cr-eb')); setTimeout(() => show($('cr-h')), 180);
    $('cr-rows').innerHTML = C.items.map((it, i) => `
      <div class="crow slide" id="cr${i}">
        <span class="name">${it.name}</span>
        <span class="freq v${it.value}">${it.freq}</span>
        <span class="w">× ${it.weight}</span>
        <span class="contrib" id="crc${i}"></span>
      </div>`).join('');
  },
  creditRows() {
    D.credit.items.forEach((it, i) => setTimeout(() => {
      show($('cr' + i));
      setTimeout(() => { $('crc' + i).innerHTML = `<span class="pop">扣 ${it.value * it.weight}</span>`; }, 450);
    }, i * 330));
  },
  creditSum() {
    const C = D.credit;
    $('cr-hint').textContent = `满分 ${C.max}（每项最多 3 档 × 分量）`;
    show($('cr-sum'));
    countUp($('cr-pen'), C.penalty, 600, () => kick($('cr-pen'), 'pulse'));
    setTimeout(() => {
      $('cr-formula').textContent = `本轮得分 = 100 × (1 − ${C.penalty} ÷ ${C.max}) = ${fmt(C.score)}`;
      show($('cr-formula'));
    }, 800);
  },
  creditSide() {
    const C = D.credit;
    $('cr-side').innerHTML = C.cards.map((c, i) =>
      `<div class="chip fade${c.red ? ' red' : ''}" id="crk${i}"><b>${c.title}</b>${c.text}</div>`).join('');
    C.cards.forEach((c, i) => setTimeout(() => show($('crk' + i)), i * 500));
  },
};
</script>
</body>
</html>
